<script>(function(){try{var B=1,c=localStorage.getItem("nt_code"),o=localStorage.getItem("nt_boot");if(o==="1"){localStorage.removeItem("nt_boot");return}if(c){var m=c.match(/NT_BUILD\s*=\s*(\d+)/),b=m?+m[1]:0;if(b>B){localStorage.setItem("nt_boot","1");document.open();document.write(c);document.close();return}localStorage.removeItem("nt_code")}}catch(e){}})();</script>
<style>
:root{--b:#1d6fd8;--g:#16a34a;--bg:#f4f7fb;--t:#12233d;--m:#6b7a90}

button{font:inherit;border:1px solid #d5deea;background:#fff;border-radius:12px;padding:10px 14px;color:var(--t)}button.p{background:var(--b);color:#fff;border-color:var(--b)}button.g{background:var(--g);color:#fff;border-color:var(--g)}
.c{background:#fff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(20,50,100,.08)}.big{padding:22px;text-align:center;font-weight:700;font-size:1.2rem;width:100%;margin:8px 0}

input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid #d5deea;border-radius:10px;margin:4px 0 8px;background:#fff}.ch{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.ch button{padding:6px 12px;font-size:.88rem}.ch .on{background:var(--b);color:#fff}

<script>
var NT_BUILD=1,REPO="YOUR_GITHUB_USERNAME/neet-tracker",BR="main";
var $=function(i){return document.getElementById(i)},e=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return"&#"+c.charCodeAt(0)+";"})};
var CAT={mcq:["MCQ Practice","MCQs"],ncert:["NCERT Reading","readings"],mock:["Mock Test","tests"],notes:["Class Notes Revision","revisions"]},WT={mcq:.4,ncert:.2,mock:.2,notes:.2},K=["mcq","ncert","mock","notes"];
var SUB={B:["Biology",.5],P:["Physics",.25],C:["Chemistry",.25]};
/* NMC-style unit list - verify against official NMC/NTA 2026-27 syllabus and edit here */
var SY={B:[["Diversity in the Living World","Structural Organisation in Animals and Plants","Cell Structure and Function","Plant Physiology","Human Physiology"],["Reproduction","Genetics and Evolution","Biology and Human Welfare","Biotechnology and Its Applications","Ecology and Environment"]],
P:[["Physics and Measurement","Kinematics","Laws of Motion","Work, Energy and Power","Rotational Motion","Gravitation","Properties of Solids and Liquids","Thermodynamics","Kinetic Theory of Gases","Oscillations and Waves"],["Electrostatics","Current Electricity","Magnetic Effects of Current and Magnetism","Electromagnetic Induction and AC","Electromagnetic Waves","Optics","Dual Nature of Matter and Radiation","Atoms and Nuclei","Electronic Devices"]],
C:[["Some Basic Concepts of Chemistry","Structure of Atom","Classification of Elements and Periodicity","Chemical Bonding and Molecular Structure","Chemical Thermodynamics","Equilibrium","Redox Reactions","Organic Chemistry: Basic Principles","Hydrocarbons"],["Solutions","Electrochemistry","Chemical Kinetics","p-Block Elements","d- and f-Block Elements","Coordination Compounds","Haloalkanes and Haloarenes","Alcohols, Phenols and Ethers","Aldehydes, Ketones and Carboxylic Acids","Amines","Biomolecules"]]};
var CH=[];for(var s in SY)for(var ci=0;ci<2;ci++)SY[s][ci].forEach(function(n,i){CH.push({id:s+(11+ci)+"-"+i,s:s,c:11+ci,n:n})});
function chap(id){return CH.filter(function(h){return h.id===id})[0]}
function ld(){try{var d=JSON.parse(localStorage.getItem("nt_data"));if(d&&d.acts){d.tg=d.tg||{mcq:200,ncert:2,mock:1,notes:2};d.ms=d.ms||{};return d}}catch(x){}return{acts:[],tg:{mcq:200,ncert:2,mock:1,notes:2},ms:{}}}
var D=ld(),V={p:"splash",tab:"edit",cf:0,sf:"all",fm:null,ed:null,msg:""};
var MS=[["first","First Step"],["days7","Consistency Begins"],["p25","25% Journey"],["p50","Halfway There"],["p75","Final Stretch"],["p100","Mission Complete"]];
function put(){try{localStorage.setItem("nt_data",JSON.stringify(D))}catch(x){toast("Storage error")}}
function sv(){put();var p=ovr()*100,dy={};D.acts.forEach(function(a){dy[a.date]=1});var ok={first:D.acts.length>0,days7:Object.keys(dy).length>=7,p25:p>=25,p50:p>=50,p75:p>=75,p100:p>=99.99},n=[];MS.forEach(function(m){if(ok[m[0]]&&!D.ms[m[0]]){D.ms[m[0]]=new Date().toISOString();n.push(m[1])}});if(n.length){put();toast("Milestone unlocked: "+n.join(", "))}}
function toast(m){var t=$("T");t.textContent=m;t.className="s1";clearTimeout(toast.i);toast.i=setTimeout(function(){t.className=""},3200)}
function st(id){var r={mcq:0,ncert:0,mock:0,notes:0,c:0,w:0,n:0,last:""};r.a=D.acts.filter(function(x){return x.ch===id});r.a.forEach(function(x){r[x.cat]+=x.q;r.c+=x.c||0;r.w+=x.w||0;r.n++;if(x.date>r.last)r.last=x.date});return r}
function pr(s){var p=0;K.forEach(function(k){p+=WT[k]*Math.min(s[k]/D.tg[k],1)});return p}
function mas(s){var q=s.a.filter(function(x){return(x.c||0)+(x.w||0)>0});if(!q.length)return null;var c=0,t=0,rc=0,rt=0;q.forEach(function(x){c+=x.c;t+=x.c+x.w});q.sort(function(a,b){return(a.date+a.time)<(b.date+b.time)?1:-1}).slice(0,3).forEach(function(x){rc+=x.c;rt+=x.c+x.w});return .5*c/t+.3*rc/rt+.2*Math.min(s.ncert+s.notes,3)/3}
function ag(f){var r={p:0,mcq:0,ncert:0,mock:0,notes:0,done:0,n:0};CH.filter(f).forEach(function(h){var s=st(h.id),p=pr(s);r.n++;r.p+=p;K.forEach(function(k){r[k]+=s[k]});if(p>=.999)r.done++});r.p=r.n?r.p/r.n:0;return r}
function ovr(){var t=0;for(var s in SUB)t+=SUB[s][1]*ag(function(h){return h.s===s}).p;return t}
var pc=function(x){return Math.round(x*100)+"%"},bar=function(x){return'<div class="bar"><i style="width:'+Math.round(x*100)+'%"></i></div>'};
function go(p,o){for(var k in o)V[k]=o[k];V.p=p;V.msg="";render();scrollTo(0,0)}
function hdr(t,b){return'<div class="h">'+(b?'<button onclick="go(\''+b+'\')">‹</button>':'')+'<b>'+e(t)+'</b><button onclick="go(\'set\',{bk:V.p})">⚙</button></div>'}
function sSplash(){return'<div class="sp"><img src="logo.jpg" alt="NEET TRACKER"><h1>Hello Doctor Ashu</h1><div class="s">Your NEET journey starts here</div></div>'}
function sHome(){return hdr("NEET TRACKER")+'<button class="p big" onclick="go(\'wcls\')">WORK<div class="s" style="color:#dbe8ff">Record what you studied</div></button><button class="g big" onclick="go(\'trk\')">TRACKER<div class="s" style="color:#dcfce7">See how far you have come</div></button>'}
function sWcls(){return hdr("WORK · Class","home")+[11,12].map(function(c){return'<button class="big c" onclick="go(\'wsub\',{c:'+c+'})">Class '+c+'</button>'}).join("")}
function sWsub(){return hdr("Class "+V.c+" · Subject","wcls")+["B","P","C"].map(function(s){return'<button class="big c" onclick="go(\'wch\',{s:\''+s+'\'})">'+SUB[s][0]+'</button>'}).join("")}
function chList(l,to,back,t){return hdr(t,back)+l.map(function(h){var s=st(h.id);return'<div class="c" onclick="go(\''+to+'\',{ch:\''+h.id+'\'})"><b>'+e(h.n)+'</b><div class="s">'+s.n+' sessions · '+(s.last||"not started")+'</div></div>'}).join("")}
function sWch(){return chList(CH.filter(function(h){return h.s===V.s&&h.c===V.c}),"ch","wsub",SUB[V.s][0]+" · Class "+V.c)}
function today(){var d=new Date();return{date:d.toLocaleDateString("en-CA"),time:d.toTimeString().slice(0,5)}}
function form(){var f=V.fm||(V.fm=Object.assign({cat:"mcq",q:"",c:"",w:"",desc:""},today()));return'<div class="c"><b>'+(V.ed?"Edit activity":"Add activity")+'</b><input id="nl" placeholder="Type e.g. Today I completed 100 MCQs"><button onclick="nlGo()">Detect from text</button><div class="er s">'+e(V.msg)+'</div><select id="fc">'+K.map(function(k){return'<option value="'+k+'"'+(f.cat===k?" selected":"")+'>'+CAT[k][0]+'</option>'}).join("")+'</select><input id="fq" type="number" min="1" placeholder="Quantity / sessions" value="'+e(f.q)+'"><div class="gr"><input id="fd" type="date" value="'+f.date+'"><input id="ft" type="time" value="'+f.time+'"></div><div class="gr"><input id="fr" type="number" min="0" placeholder="Correct (optional)" value="'+e(f.c)+'"><input id="fw" type="number" min="0" placeholder="Incorrect (optional)" value="'+e(f.w)+'"></div><textarea id="fx" rows="2" placeholder="Description (optional)">'+e(f.desc)+'</textarea><button class="p" onclick="svAct()">'+(V.ed?"Update":"Save")+'</button>'+(V.ed?' <button onclick="V.ed=null;V.fm=null;render()">Cancel</button>':'')+'</div>'}
function rd(){return{cat:$("fc").value,q:$("fq").value,date:$("fd").value,time:$("ft").value,c:$("fr").value,w:$("fw").value,desc:$("fx").value}}
function parse(t){t=t.toLowerCase();var W={once:1,one:1,"एक":1,twice:2,two:2,"दो":2,thrice:3,three:3,"तीन":3},n=null,m=t.match(/\d+/),c=[];if(m)n=+m[0];else for(var k in W)if(t.indexOf(k)>=0){n=W[k];break}
if(/mcq|question|प्रश्न/.test(t))c.push("mcq");if(/ncert|reading|read|पढ़/.test(t))c.push("ncert");if(/mock|test|टेस्ट/.test(t))c.push("mock");if(/notes|नोट्स/.test(t))c.push("notes");return{c:c,n:n}}
function nlGo(){var f=rd(),t=$("nl").value.trim(),r=parse(t);V.fm=f;if(!t){V.msg="Type something first."}else if(r.c.length!==1){V.msg="Could not decide the category. Please select it below."}else{f.cat=r.c[0];f.desc=t;if(r.n)f.q=r.n;else if(f.cat==="mcq"){f.q="";V.msg="Detected MCQ Practice, but quantity is unclear. Enter it."}else f.q=1;if(!V.msg)V.msg="Detected: "+CAT[f.cat][0]+" × "+f.q+". Check and Save."}render()}
function svAct(){var f=rd(),q=+f.q,c=+f.c||0,w=+f.w||0;V.fm=f;if(!(q>=1)||q%1){V.msg="Enter a valid whole quantity.";return render()}if(c<0||w<0||(f.cat==="mcq"&&c+w>q)){V.msg="Correct + incorrect cannot exceed MCQ count.";return render()}if(!f.date||!f.time){V.msg="Date and time required.";return render()}
var dup=D.acts.some(function(a){return a.id!==V.ed&&a.ch===V.ch&&a.cat===f.cat&&a.q===q&&a.date===f.date&&a.time===f.time&&a.desc===f.desc.trim()});if(dup){V.msg="Duplicate entry blocked (same details already saved).";return render()}
var r={ch:V.ch,cat:f.cat,q:q,date:f.date,time:f.time,desc:f.desc.trim(),c:c,w:w};if(V.ed){var a=D.acts.filter(function(x){return x.id===V.ed})[0];Object.assign(a,r,{upd:new Date().toISOString()})}else{r.id="a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);r.ts=new Date().toISOString();D.acts.push(r)}
sv();V.ed=null;V.fm=null;V.msg="";toast("Saved");render()}
function edAct(id){var a=D.acts.filter(function(x){return x.id===id})[0];V.ed=id;V.tab="edit";V.fm={cat:a.cat,q:a.q,date:a.date,time:a.time,c:a.c||"",w:a.w||"",desc:a.desc};render();scrollTo(0,0)}
function dlAct(id){if(!confirm("Delete this activity?"))return;D.acts=D.acts.filter(function(x){return x.id!==id});sv();render()}
function stat(s){var m=mas(s);return'<div class="c"><b>WORK STATUS</b><div class="row"><span>Total MCQs</span><b>'+s.mcq+'</b></div><div class="row"><span>NCERT readings</span><b>'+s.ncert+'</b></div><div class="row"><span>Mock tests</span><b>'+s.mock+'</b></div><div class="row"><span>Class notes revisions</span><b>'+s.notes+'</b></div><div class="row"><span>Correct / incorrect</span><b>'+(s.c+s.w?s.c+" / "+s.w:"not recorded")+'</b></div><div class="row"><span>Last activity</span><b>'+(s.last||"—")+'</b></div><div class="row"><span>Sessions</span><b>'+s.n+'</b></div></div>'}
function hist(s){var a=s.a.slice().sort(function(x,y){return(y.date+y.time)<(x.date+x.time)?-1:1});return'<div class="c"><b>Activity history</b>'+(a.length?a.map(function(x){return'<div class="row" style="border-top:1px solid #eef2f7;margin-top:6px"><div><b>'+CAT[x.cat][0]+' × '+x.q+'</b><div class="s">'+x.date+' '+x.time+'</div>'+(x.desc?'<div class="s">'+e(x.desc)+'</div>':'')+'</div><div><button onclick="edAct(\''+x.id+'\')">✎</button> <button onclick="dlAct(\''+x.id+'\')">🗑</button></div></div>'}).join(""):'<div class="s">No activity yet. Use WORK EDIT to add one.</div>')+'</div>'}
function sCh(){var h=chap(V.ch),s=st(V.ch);return hdr(h.n,"wch")+'<div class="bt"><button class="p" onclick="V.tab=\'edit\';render()">WORK EDIT</button><button onclick="V.tab=\'status\';render()">WORK STATUS</button></div>'+(V.tab==="edit"?form():stat(s))+hist(s)}
function sTrk(){return hdr("TRACKER","home")+'<button class="p big" onclick="go(\'ovr\')">OVERALL JOURNEY TRACKER</button><button class="g big" onclick="go(\'tsub\')">SUBJECT-WISE / CHAPTER-WISE</button>'}
function sOvr(){var o=ovr(),t=ag(function(){return 1}),d={};D.acts.forEach(function(a){d[a.date]=1});var c11=ag(function(h){return h.c===11}),c12=ag(function(h){return h.c===12});
return hdr("My NEET Mission","trk")+'<div class="c"><svg viewBox="0 0 540 210" width="100%"><path id="jp" d="M30,160 C130,30 230,200 330,115 S470,60 500,95" fill="none" stroke="#cfe0f5" stroke-width="10" stroke-linecap="round"/><g id="jm"></g><g id="jf"></g><g id="jc"><circle cy="-24" r="8" fill="#f4c9a0"/><rect x="-10" y="-35" width="20" height="5" fill="#12233d"/><rect x="-7" y="-16" width="14" height="18" rx="5" fill="#1d6fd8"/></g></svg><div class="row"><b style="font-size:1.6rem">'+pc(o)+'</b><span class="s">overall preparation</span></div>'+bar(o)+'</div><div class="gr"><div class="c"><b>'+t.mcq+'</b>MCQs</div><div class="c"><b>'+t.ncert+'</b>NCERT readings</div><div class="c"><b>'+t.mock+'</b>Mock tests</div><div class="c"><b>'+t.notes+'</b>Notes revisions</div><div class="c"><b>'+t.done+'</b>Chapters done</div><div class="c"><b>'+(t.n-t.done)+'</b>Remaining</div></div><div class="c"><b>Progress by group</b>'+[["Class 11",c11.p],["Class 12",c12.p]].concat(Object.keys(SUB).map(function(s){return[SUB[s][0],ag(function(h){return h.s===s}).p]})).map(function(x){return'<div class="row"><span>'+x[0]+'</span><b>'+pc(x[1])+'</b></div>'+bar(x[1])}).join("")+'</div><div class="c"><b>Milestones</b>'+MS.map(function(m){return'<div class="row"><span>'+m[1]+'</span><span class="tag">'+(D.ms[m[0]]?"Unlocked "+D.ms[m[0]].slice(0,10):"Locked")+'</span></div>'}).join("")+'<div class="s">Active study days: '+Object.keys(d).length+'</div></div><div class="s">Progress shows preparation activity against your targets. It does not predict rank or admission.</div>'}
function jr(){var p=$("jp");if(!p)return;var L=p.getTotalLength(),P=function(t){return p.getPointAtLength(L*t)},s="",o=ovr();[0,.25,.5,.75,1].forEach(function(t){var q=P(t);s+='<circle cx="'+q.x+'" cy="'+q.y+'" r="6" fill="'+(o>=t-1e-9?"#16a34a":"#fff")+'" stroke="#1d6fd8" stroke-width="2"/>'});$("jm").innerHTML=s;var f=P(1);$("jf").innerHTML='<g transform="translate('+f.x+','+f.y+')"><line y2="-46" stroke="#12233d" stroke-width="3"/><path d="M0-46h30l-8 9 8 9H0z" fill="#16a34a"/><text y="-56" x="6" text-anchor="middle" font-size="14" font-weight="700" fill="#1d6fd8">AIM: AIIMS</text><text y="22" text-anchor="middle" font-size="13" fill="#6b7a90">NEET 2028</text></g>';var c=$("jc"),a=P(0),b=P(Math.min(o,1));c.style.transform="translate("+a.x+"px,"+a.y+"px)";setTimeout(function(){c.style.transform="translate("+b.x+"px,"+b.y+"px)"},60)}
function sTsub(){return hdr("Subjects","trk")+Object.keys(SUB).map(function(s){var a=ag(function(h){return h.s===s});return'<div class="c" onclick="go(\'tch\',{s:\''+s+'\'})"><div class="row"><b>'+SUB[s][0]+'</b><b>'+pc(a.p)+'</b></div>'+bar(a.p)+'<div class="s">'+a.mcq+' MCQs · '+a.mock+' tests · '+a.ncert+' NCERT readings<br>'+a.done+' chapters done · '+(a.n-a.done)+' remaining</div></div>'}).join("")}
function revs(s){if(s.ncert+s.notes===0)return"Not revised";if(s.last&&(Date.now()-new Date(s.last))/864e5>30)return"Needs revision";return"Revised"}
function sTch(){var cf=[[0,"All classes"],[11,"Class 11"],[12,"Class 12"]],sf=[["all","All"],["done","Completed"],["prog","In progress"],["new","Not started"],["weak","Weak"]];
var l=CH.filter(function(h){if(h.s!==V.s||(V.cf&&h.c!==V.cf))return false;var s=st(h.id),p=pr(s),m=mas(s);return V.sf==="all"||(V.sf==="done"&&p>=.999)||(V.sf==="prog"&&p>0&&p<.999)||(V.sf==="new"&&s.n===0)||(V.sf==="weak"&&m!==null&&m<.6)});
return hdr(SUB[V.s][0],"tsub")+'<div class="ch">'+cf.map(function(x){return'<button class="'+(V.cf===x[0]?"on":"")+'" onclick="V.cf='+x[0]+';render()">'+x[1]+'</button>'}).join("")+'</div><div class="ch">'+sf.map(function(x){return'<button class="'+(V.sf===x[0]?"on":"")+'" onclick="V.sf=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join("")+'</div>'+(l.length?l.map(function(h){var s=st(h.id),p=pr(s),m=mas(s);return'<div class="c" onclick="go(\'cd\',{ch:\''+h.id+'\'})"><div class="row"><b>'+e(h.n)+'</b><b>'+pc(p)+'</b></div>'+bar(p)+'<div class="s">Mastery: '+(m===null?"no scores yet":pc(m))+' · '+revs(s)+'<br>MCQ '+s.mcq+' · NCERT '+s.ncert+' · Mock '+s.mock+' · Notes '+s.notes+'<br>Last: '+(s.last||"—")+' · Class '+h.c+'</div></div>'}).join(""):'<div class="c s">No chapters match this filter.</div>')}
function sCd(){var h=chap(V.ch),s=st(V.ch),m=mas(s);return hdr(h.n,"tch")+'<div class="c"><div class="row"><span>Preparation progress</span><b>'+pc(pr(s))+'</b></div>'+bar(pr(s))+'<div class="row"><span>Mastery (performance)</span><b>'+(m===null?"no scores yet":pc(m))+'</b></div>'+(m===null?"":bar(m))+'<div class="row"><span>Revision status</span><b>'+revs(s)+'</b></div><div class="s">Activity count, preparation progress and mastery are kept separate.</div></div>'+stat(s)+hist(s)+'<button class="p" onclick="go(\'ch\',{tab:\'edit\'})">Add activity in WORK</button>'}
function sSet(){var t=D.tg;return hdr("Settings",V.bk||"home")+'<div class="c"><b>App update</b><div class="s">Version 1.0.0 · build '+NT_BUILD+(localStorage.getItem("nt_code")?" (updated)":" (original)")+'</div><button class="p" onclick="upd()">Check for update</button> <button onclick="appPick()">Update from file</button><div class="bt"><button onclick="roll()">Previous version</button><button onclick="rst()">Original version</button></div><div class="s" id="um">Your study data is never touched by updates.</div></div><div class="c"><b>Targets per chapter</b>'+K.map(function(k){return'<div class="s">'+CAT[k][0]+'</div><input id="t_'+k+'" type="number" min="1" value="'+t[k]+'">'}).join("")+'<button class="p" onclick="svT()">Save targets</button></div><div class="c"><b>Backup</b><div class="bt"><button onclick="bk()">Backup (JSON)</button><button onclick="rs()">Restore</button></div></div><div class="c"><b>How progress is calculated</b><div class="s">Chapter progress = 40% MCQs + 20% NCERT + 20% mock tests + 20% notes, each capped at its target (extra MCQs do not add more). Overall = Biology 50% + Physics 25% + Chemistry 25%, each the average of its chapters. Mastery uses only recorded correct/incorrect scores (50% overall accuracy, 30% last 3 scored sessions, 20% revision) and is shown separately. Missing activity counts as zero.</div></div>'}
function svT(){K.forEach(function(k){var v=+$("t_"+k).value;if(v>=1)D.tg[k]=v});sv();toast("Targets saved")}
async function upd(){var m=$("um");m.textContent="Checking...";try{var b="https://raw.githubusercontent.com/"+REPO+"/"+BR+"/",j=await(await fetch(b+"version.json?t="+Date.now(),{cache:"no-store"})).json();if(!(j.build>NT_BUILD)){m.textContent="You have the latest version.";return}if(!confirm("Update to "+j.version+" (build "+j.build+")? Your data stays safe."))return;var t=await(await fetch(b+"www/index.html?t="+Date.now(),{cache:"no-store"})).text(),x=t.match(/NT_BUILD\s*=\s*(\d+)/);if(!x||+x[1]!==j.build||t.indexOf("nt_boot")<0){m.textContent="Update file invalid. Not applied.";return}var o=localStorage.getItem("nt_code");if(o)localStorage.setItem("nt_prev",o);localStorage.setItem("nt_code",t);location.reload()}catch(x){m.textContent="Update failed. Check internet and REPO name."}}
function appPick(){var f=document.createElement("input");f.type="file";f.accept=".html,.htm,.txt";f.onchange=function(){var r=new FileReader();r.onload=function(){var t=String(r.result),x=t.match(/NT_BUILD\s*=\s*(\d+)/);if(!x||t.indexOf("nt_boot")<0||+x[1]<=NT_BUILD){alert("Not a newer NEET TRACKER file.");return}var o=localStorage.getItem("nt_code");if(o)localStorage.setItem("nt_prev",o);localStorage.setItem("nt_code",t);location.reload()};r.readAsText(f.files[0])};f.click()}
function roll(){var p=localStorage.getItem("nt_prev");if(!p){alert("No previous version.");return}localStorage.setItem("nt_code",p);localStorage.removeItem("nt_prev");location.reload()}
function rst(){if(confirm("Go back to the original version?")){localStorage.removeItem("nt_code");localStorage.removeItem("nt_prev");location.reload()}}
function bk(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"NEET-TRACKER",t:new Date().toISOString(),d:D})],{type:"application/json"}));a.download="neet-tracker-backup-"+today().date+".json";a.click()}
function rs(){var f=document.createElement("input");f.type="file";f.accept=".json";f.onchange=function(){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(o.app!=="NEET-TRACKER"||!o.d||!Array.isArray(o.d.acts))throw 0;if(!confirm("Replace current data with this backup ("+o.d.acts.length+" activities)?"))return;D=o.d;D.tg=D.tg||{mcq:200,ncert:2,mock:1,notes:2};D.ms=D.ms||{};put();toast("Restored");go("home")}catch(x){alert("Invalid backup file.")}};r.readAsText(f.files[0])};f.click()}
var SC={splash:sSplash,home:sHome,wcls:sWcls,wsub:sWsub,wch:sWch,ch:sCh,trk:sTrk,ovr:sOvr,tsub:sTsub,tch:sTch,cd:sCd,set:sSet};
function render(){try{$("A").innerHTML=SC[V.p]();if(V.p==="ovr")jr()}catch(x){$("A").innerHTML='<div class="c er">Something went wrong. <button onclick="go(\'home\')">Home</button></div>'}}
render();setTimeout(function(){if(V.p==="splash")go("home")},2600);
</script></body></html>
